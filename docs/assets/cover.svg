<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Google Tasks integration for Gladys Assistant (illustration,
       no Google logo). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#1b3a63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <g stroke="#213f66" stroke-width="1">
    <path d="M0 89 H800 M0 178 H800 M0 267 H800 M0 356 H800 M0 445 H800"/>
    <path d="M100 0 V534 M200 0 V534 M300 0 V534 M400 0 V534 M500 0 V534 M600 0 V534 M700 0 V534"/>
  </g>
  <ellipse cx="260" cy="280" rx="260" ry="200" fill="url(#glow)"/>

  <!-- the task card -->
  <rect x="74" y="104" width="360" height="350" rx="22" fill="#000000" opacity="0.28"/>
  <rect x="70" y="92" width="360" height="350" rx="22" fill="#ffffff"/>
  <rect x="70" y="92" width="360" height="62" rx="22" fill="#2f6fde"/>
  <rect x="70" y="132" width="360" height="22" fill="#2f6fde"/>
  <g fill="#ffffff">
    <rect x="98" y="114" width="22" height="22" rx="5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M103 125 l5 5 l9 -11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="134" y="117" width="150" height="14" rx="7" opacity="0.9"/>
  </g>

  <!-- row 1: overdue -->
  <circle cx="110" cy="196" r="13" fill="none" stroke="#9aa6b8" stroke-width="3"/>
  <rect x="138" y="186" width="160" height="12" rx="6" fill="#273449"/>
  <rect x="138" y="205" width="90" height="9" rx="4.5" fill="#b4bfcf"/>
  <rect x="320" y="184" width="86" height="26" rx="13" fill="#fde2e1"/>
  <rect x="334" y="193" width="58" height="8" rx="4" fill="#d63939"/>
  <!-- row 2: today -->
  <circle cx="110" cy="262" r="13" fill="none" stroke="#9aa6b8" stroke-width="3"/>
  <rect x="138" y="252" width="130" height="12" rx="6" fill="#273449"/>
  <rect x="138" y="271" width="70" height="9" rx="4.5" fill="#b4bfcf"/>
  <rect x="320" y="250" width="86" height="26" rx="13" fill="#fff1d6"/>
  <rect x="334" y="259" width="58" height="8" rx="4" fill="#f59f00"/>
  <!-- row 3: done -->
  <circle cx="110" cy="328" r="13" fill="#2fb344"/>
  <path d="M103 328 l5 5 l9 -11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="138" y="322" width="150" height="12" rx="6" fill="#c9d1dd"/>
  <path d="M136 328 H292" stroke="#9aa6b8" stroke-width="2"/>
  <!-- add button -->
  <rect x="98" y="374" width="128" height="40" rx="10" fill="#2f6fde"/>
  <path d="M120 394 h16 M128 386 v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <rect x="146" y="389" width="60" height="10" rx="5" fill="#ffffff"/>

  <!-- link to the house (Gladys) -->
  <g fill="none" stroke="#5fd08f" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13">
    <path d="M450 268 H560"/>
  </g>
  <g transform="translate(640 268)">
    <circle r="62" fill="#14304f" stroke="#7fb8ff" stroke-width="4"/>
    <path d="M-30 4 L0 -24 L30 4 M-20 -4 V26 H20 V-4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-7" y="8" width="14" height="18" fill="#ffffff"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="640" y="380" font-size="30" font-weight="bold">Google Tasks</text>
    <text x="640" y="412" font-size="18" fill="#a9c4ea">Gladys Assistant</text>
  </g>
</svg>
